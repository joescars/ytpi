<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download Queued</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- <meta http-equiv="refresh" content="1;url=/status?job={{ job_id }}"> -->
  <style>
    body { background: #f7f7f7; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">ytpi Downloader</a>
    </div>
  </nav>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="alert alert-success" role="alert">
          <h4 class="alert-heading">Queued!</h4>
          <p>Your download has been queued.</p>
          <hr>
          <p class="mb-0">Job ID: <code>{{ job_id }}</code></p>
        </div>
        <div class="text-center">
          <a class="btn btn-primary" href="/status?job={{ job_id }}">Go to Dashboard</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
