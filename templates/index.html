<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ytpi Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .main-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { max-width: 420px; width: 100%; margin: 40px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .result { margin-top: 20px; text-align: center; }
        .error { color: #dc3545; }
        .success { color: #198754; }
    </style>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">ytpi Downloader</a>
        </div>
    </nav>
    <div class="main-container">
        <div class="card p-4 bg-light text-dark">
            <h2 class="mb-4 text-center">Video Downloader</h2>
            <form action="/download" method="POST">
                <div class="mb-3">
                    <input type="text" class="form-control" id="url" name="url" placeholder="Enter video or playlist URL" required>
                </div>
                <div class="mb-3">
                    <select class="form-select" id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="Bible-Studies">Bible Studies</option>
                        <option value="YouTube/Cooking">Cooking</option>
                        <option value="Music-Videos">Music Videos</option>
                        <option value="YouTube/Education">Education</option>
                        <option value="YouTube/Education/Guitar-Songs">Education (Guitar-Songs)</option>
                        <option value="YouTube/Education/Guitar-Setup">Education (Guitar-Setup)</option>
                        <option value="YouTube/Education/Parenting">Education (Parenting)</option>
                        <option value="YouTube/Education/Recording">Education (Recording)</option>
                        <option value="YouTube/News">News</option>
                        <option value="YouTube/Sports">Sports</option>
                        <option value="YouTube/Other">Other</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Download</button>
            </form>
            {% if error %}
                <div class="result error">{{ error }}</div>
            {% endif %}
            <div class="result" id="result"></div>
            <a href="/status" class="btn btn-link mt-3 w-100">Check Download Status</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
