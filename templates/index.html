{% extends "base.html" %}
{% block title %}Queue Download{% endblock %}
{% block content %}
  <section class="surface" style="padding: 1.2rem;">
    <div class="stack" style="gap:0.35rem; margin-bottom: 0.8rem;">
      <h1>Queue Download</h1>
      <p class="text-muted">Download videos from YouTube as MP4 or audio‑only.</p>
    </div>

    <form method="post" action="/download" enctype="multipart/form-data">
      <div>
        <label for="url">URLs (one per line)</label>
        <textarea id="url" name="url" rows="6" placeholder="https://youtube.com/watch?v=...
https://youtu.be/..." required autofocus>{{ url_value }}</textarea>
      </div>

      <div>
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="" disabled {% if not category %}selected{% endif %}>— Choose a category —</option>
          {% for cat in categories %}
          <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="customCategory">Custom category (optional)</label>
        <input type="text" id="customCategory" name="custom_category" placeholder="my-playlist-name" value="{{ custom_category }}">
      </div>

      <div>
        <label for="quality">Quality</label>
        <select id="quality" name="quality">
          <option value="max" selected>Max Quality (Default)</option>
          <option value="2160" >2160p (4K)</option>
          <option value="1440" >1440p (2K)</option>
          <option value="1080" >1080p (Full HD)</option>
          <option value="720" >720p (HD)</option>
          <option value="480" >480p</option>
        </select>
      </div>

      <div>
        <label class="checkbox-label">
          <input id="audioOnly" name="audio_only" type="checkbox" value="on" >
          Download audio only
        </label>
      </div>

      <div id="audioFormatWrap" hidden>
        <label for="audioFormat">Audio Format</label>
        <select id="audioFormat" name="audio_format">
          <option value="mp3" selected>MP3</option>
          <option value="wav" >WAV</option>
        </select>
      </div>

      
      {% if error %}
        <div id="form-error" class="error-box" role="alert">{{ error }}</div>
      {% endif %}

      <div class="actions">
        <button id="submit-btn" type="submit" class="btn btn-primary">Queue Download</button>
        <a href="/status" class="btn btn-muted">Open Dashboard</a>
      </div>
    </form>
  </section>
{% endblock %}
{% block scripts %}
  <script src="/static/index.js" defer></script>
{% endblock %}
