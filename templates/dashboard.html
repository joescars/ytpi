<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ytpi | Dashboard</title>
  <link rel="stylesheet" href="/static/ui.css">
</head>
<body data-default-job-id="{{ default_job_id or '' }}">
  <main class="shell stack enter">
    <header class="topbar">
      <a href="/" class="brand">ytpi<small>live queue monitor</small></a>
      <div class="actions">
        <button id="refresh-btn" type="button" class="btn btn-muted">Refresh</button>
        <button id="clear-finished-btn" type="button" class="btn btn-danger">Clear Finished</button>
      </div>
    </header>

    <section class="kpis">
      <article class="kpi"><h3 id="kpi-total">0</h3><p>Total Jobs</p></article>
      <article class="kpi"><h3 id="kpi-active">0</h3><p>Active</p></article>
      <article class="kpi"><h3 id="kpi-done">0</h3><p>Finished</p></article>
      <article class="kpi"><h3 id="kpi-errors">0</h3><p>Errors</p></article>
    </section>

    <section class="layout">
      <article class="surface" style="padding: 0.8rem;">
        <div class="table-wrap">
          <table class="jobs" aria-label="Download Jobs">
            <thead>
              <tr>
                <th>ID</th>
                <th>Status</th>
                <th>Progress</th>
                <th>ETA</th>
                <th>Speed</th>
                <th>URL</th>
                <th>Error</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="jobs-body" aria-live="polite" aria-relevant="additions removals text">
              <tr><td colspan="8" class="empty">Loading jobs...</td></tr>
            </tbody>
          </table>
        </div>
      </article>

      <article class="surface" style="padding: 0.9rem;">
        <p id="output-meta" class="output-meta" aria-live="polite">Select a job to view command output.</p>
        <pre id="job-output" class="output">Select a job to view output.</pre>
      </article>
    </section>
  </main>

  <script src="/static/dashboard.js" defer></script>
</body>
</html>
