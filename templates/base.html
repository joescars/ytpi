<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ytpi | {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/ui.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ytpi">
  {% block head_extra %}{% endblock %}
</head>
<body{% if default_job_id %} data-default-job-id="{{ default_job_id }}"{% endif %}>
  <main class="shell stack enter">
    <header class="topbar">
      <a href="/" class="brand">ytpi<small>local downloader</small></a>
      <nav class="nav" aria-label="Primary navigation">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="/" class="nav-link{% if request.endpoint == 'home' %} active{% endif %}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>
              New Download
            </a>
          </li>
          <li class="nav-item">
            <a href="/status" class="nav-link{% if request.endpoint == 'status' %} active{% endif %}" {% if request.endpoint == 'status' %}aria-current="page"{% endif %}>
              Downloads
            </a>
          </li>
          <li class="nav-item">
            <a href="/status#playlists" class="nav-link" id="playlists-nav-link">
              Playlists
            </a>
          </li>
        </ul>
      </nav>
    </header>

    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
