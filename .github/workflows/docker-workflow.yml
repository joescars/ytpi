# testing runner on new server
# 
name: ytpi-docker-workflow

on: workflow_dispatch

env:
  APP_DIR: ${{ vars.YTPI_DOCKER_APP_DIR }}
  
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Update deployment Compose file
        run: |
          if [ -z "$APP_DIR" ]; then
            echo "Repository variable YTPI_DOCKER_APP_DIR must be set to the writable Docker deployment directory." >&2
            exit 1
          fi
          case "$APP_DIR" in
            /*) ;;
            *) echo "YTPI_DOCKER_APP_DIR must be an absolute path." >&2; exit 1 ;;
          esac
          APP_DIR="$(realpath -m -- "$APP_DIR")"
          WORKSPACE="$(realpath -m -- "$GITHUB_WORKSPACE")"
          case "$WORKSPACE/" in
            "$APP_DIR/"*) echo "YTPI_DOCKER_APP_DIR cannot contain the runner checkout." >&2; exit 1 ;;
          esac
          case "$APP_DIR/" in
            "$WORKSPACE/"*) echo "YTPI_DOCKER_APP_DIR cannot be inside the runner checkout." >&2; exit 1 ;;
          esac
          mkdir -p "$APP_DIR"
          install -m 0644 "$GITHUB_WORKSPACE/docker-compose.yml" "$APP_DIR/docker-compose.yml"

      - name: Pull and Run Docker Image
        run: |
          cd "$APP_DIR"
          docker compose config --quiet
          docker compose pull ytpi
          # Persist a consistent SQLite backup outside data/ because that directory
          # may be owned by the app user and read-only to this deployment runner.
          if [ -f data/jobs.db ]; then
            backup_dir="$APP_DIR/.deployment-backups"
            mkdir -p "$backup_dir"
            backup="$backup_dir/jobs-pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).sqlite3"
            python3 -c 'import os,sqlite3,sys; src=sqlite3.connect("file:data/jobs.db?mode=ro",uri=True); dst=sqlite3.connect(sys.argv[1]); src.backup(dst); dst.close(); src.close(); os.chmod(sys.argv[1],0o600); print("SQLite backup created:",sys.argv[1])' "$backup"
          fi
          docker compose down --remove-orphans
          # The legacy stack may use container_name: ytpi under a different Compose
          # project, so remove that exact stale container before reusing its fixed name.
          docker rm -f ytpi 2>/dev/null || true
          docker compose up -d --no-build
          docker compose ps
          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' ytpi 2>/dev/null || true)"
            echo "YTPI container health: ${health:-missing} (attempt ${attempt}/30)"
            case "$health" in
              healthy)
                curl --fail --retry 5 --retry-all-errors --retry-delay 2 http://127.0.0.1:7434/healthz
                exit 0
                ;;
              unhealthy|"")
                if [ "$health" = "unhealthy" ]; then
                  docker compose logs --no-color --tail=100 ytpi
                  exit 1
                fi
                ;;
            esac
            sleep 5
          done
          docker compose logs --no-color --tail=100 ytpi
          exit 1

