# testing runner on new server
# 
name: ytpi-workflow

on: workflow_dispatch
jobs:
  build:
    runs-on: self-hosted
    env:
      YTPI_SERVICE_DIR: ${{ vars.YTPI_SERVICE_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create Python virtual environment
        run: |
          if [ -z "$YTPI_SERVICE_DIR" ]; then
            echo "Repository variable YTPI_SERVICE_DIR must be set to the systemd deployment directory." >&2
            exit 1
          fi
          case "$YTPI_SERVICE_DIR" in
            /*) ;;
            *) echo "YTPI_SERVICE_DIR must be an absolute path." >&2; exit 1 ;;
          esac
          YTPI_SERVICE_DIR="$(realpath -m -- "$YTPI_SERVICE_DIR")"
          WORKSPACE="$(realpath -m -- "$GITHUB_WORKSPACE")"
          case "$WORKSPACE/" in
            "$YTPI_SERVICE_DIR/"*) echo "YTPI_SERVICE_DIR cannot contain the runner checkout." >&2; exit 1 ;;
          esac
          case "$YTPI_SERVICE_DIR/" in
            "$WORKSPACE/"*) echo "YTPI_SERVICE_DIR cannot be inside the runner checkout." >&2; exit 1 ;;
          esac
          cd "$YTPI_SERVICE_DIR"
          /usr/bin/python3.11 -m venv venv

      - name: be Copy files to folder
        run: |
          if [ -z "$YTPI_SERVICE_DIR" ]; then
            echo "Repository variable YTPI_SERVICE_DIR must be set to the systemd deployment directory." >&2
            exit 1
          fi
          cp -r "${{ github.workspace }}"/* "$YTPI_SERVICE_DIR"
      
      - name: Install dependencies
        run: |
          cd "$YTPI_SERVICE_DIR"
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd "$YTPI_SERVICE_DIR"
          source venv/bin/activate
          pytest -q
      - name: Restart Service
        run: |
          sudo systemctl restart ytpi.service
          sleep 5
          sudo systemctl status ytpi.service

