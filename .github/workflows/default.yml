# testing runner on new server
# 
name: ytpi-workflow

on: workflow_dispatch
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create Python virtual environment
        run: |
          cd "${YTPI_SERVICE_DIR:-/srv/ytpi}"
          /usr/bin/python3.11 -m venv venv

      - name: be Copy files to folder
        run: |
          cp -r ${{github.workspace}}/* "${YTPI_SERVICE_DIR:-/srv/ytpi}"
      
      - name: Install dependencies
        run: |
          cd "${YTPI_SERVICE_DIR:-/srv/ytpi}"
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd "${YTPI_SERVICE_DIR:-/srv/ytpi}"
          source venv/bin/activate
          pytest -q
      - name: Restart Service
        run: |
          sudo systemctl restart ytpi.service
          sleep 5
          sudo systemctl status ytpi.service

